<!-- Scene s08-jelly (1080x1920, dur 16.90s). Low-Light Slow Shutter & Active Jelly Distortion -->
<template>
<link rel="stylesheet" href="assets/kit.css">
<style>
@font-face { font-family: 'Poppins'; font-weight: 500; src: url('assets/fonts/poppins-500.woff2') format('woff2'); }
@font-face { font-family: 'Poppins'; font-weight: 700; src: url('assets/fonts/poppins-700.woff2') format('woff2'); }
#root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; font-family: 'Poppins', sans-serif; background: #F6F2EA; }
.s08-layer { position: absolute; inset: 0; transform-style: preserve-3d; will-change: transform; }
.s08-world { position: absolute; left: 50%; top: 50%; transform-style: preserve-3d; will-change: transform; }
.s08-title { position: absolute; left: 60px; top: 190px; width: 872px; box-sizing: border-box; text-align: left; opacity: 0; }

/* Hero Visual Stage (No Restrictive Box) */
.s08-stage-wrap { position: absolute; left: 540px; top: 820px; transform: translate(-50%, -50%); width: 960px; height: 620px; display: flex; align-items: center; justify-content: center; }
.s08-viewport { width: 960px; height: 600px; border-radius: 28px; overflow: hidden; position: relative; background: #0B1E3F; box-shadow: 0 24px 60px rgba(11,30,63,0.18), 0 4px 16px rgba(11,30,63,0.08); border: 3px solid #0B1E3F; opacity: 0; }

.s08-hud-dot { width: 10px; height: 10px; border-radius: 50%; background: #EF4444; box-shadow: 0 0 10px #EF4444; }

.s08-shutter-badge { position: absolute; left: 24px; bottom: 24px; background: rgba(245,158,11,0.92); backdrop-filter: blur(8px); border: 2px solid #FFFFFF; color: #FFFFFF; font-size: 15px; font-weight: 700; padding: 10px 20px; border-radius: 16px; box-shadow: 0 8px 24px rgba(245,158,11,0.35); z-index: 15; opacity: 0; }
.s08-jelly-badge { position: absolute; right: 24px; bottom: 24px; background: rgba(224,82,82,0.95); backdrop-filter: blur(8px); border: 2px solid #FFFFFF; color: #FFFFFF; font-size: 15px; font-weight: 700; padding: 10px 20px; border-radius: 16px; box-shadow: 0 8px 24px rgba(224,82,82,0.4); z-index: 15; opacity: 0; }

<div id="root" data-composition-id="s08-jelly" data-width="1080" data-height="1920">
  <div id="s08-ground" class="clip kit-ground" data-start="0" data-duration="16.90" data-track-index="0"></div>
  <div id="s08-stage" class="clip" data-start="0" data-duration="16.90" data-track-index="1" style="position:absolute; inset:0; perspective:1866px; perspective-origin:50% 50%;">
    <div id="s08-drift" class="s08-layer">
      <div id="s08-cam" class="s08-layer">
        <div class="kit-floor"></div>
        <div id="s08-headline" class="s08-world s08-title" data-layout-allow-overlap>

          <div class="kit-label" style="font-size:52px; line-height:1.18; color:#0B1E3F; font-weight:700; white-space:normal; overflow-wrap:break-word; word-wrap:break-word;">Bakit nagiging jelly ang video sa dilim?</div>

          <div id="s08-viewport" class="s08-viewport">

          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="s08-grain" class="clip kit-grain" data-start="0" data-duration="16.90" data-track-index="9"></div>
</div>
<script>
(function () {
  var $ = function (id) { return '#s08-' + id; };
  var D = 16.90;
  var tl = gsap.timeline({ paused: true });

  gsap.set($('headline'), { opacity: 0, y: -20, force3D: true });
  gsap.set($('viewport'), { opacity: 0, scale: 0.94, y: 25, force3D: true });
  gsap.set($('photo'), { opacity: 0, scale: 1.08, force3D: true });
  gsap.set($('beam'), { opacity: 0, y: 10 });
  gsap.set($('hud'), { opacity: 0, y: -15 });
  gsap.set($('fail'), { opacity: 0, y: -15 });
  gsap.set($('shutter'), { opacity: 0, x: -20 });
  gsap.set($('jelly'), { opacity: 0, x: 20 });

  // Camera Drift
  tl.fromTo($('drift'), { scale: 1, rotationY: 0 }, { scale: 1.02, rotationY: -0.3, duration: D / 2, ease: 'sine.inOut', force3D: true }, 0);
  tl.fromTo($('drift'), { scale: 1.02, rotationY: -0.3 }, { scale: 1, rotationY: 0, duration: D / 2, ease: 'sine.inOut', force3D: true, immediateRender: false }, D / 2);

  // Headline Enter
  tl.fromTo($('headline'), { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.55, ease: 'power2.out', force3D: true }, 0.10);

  // Hero Viewport Enter
  tl.fromTo($('viewport'), { opacity: 0, scale: 0.94, y: 25 }, { opacity: 1, scale: 1, y: 0, duration: 0.75, ease: 'back.out(1.4)', force3D: true }, 0.30);
  tl.fromTo($('photo'), { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.85, ease: 'power2.out', force3D: true }, 0.40);
  tl.fromTo($('hud'), { opacity: 0, y: -15 }, { opacity: 1, y: 0, duration: 0.5, ease: 'back.out(2)' }, 0.70);
  tl.fromTo($('fail'), { opacity: 0, y: -15 }, { opacity: 1, y: 0, duration: 0.5, ease: 'back.out(2)' }, 0.90);

  // Slow shutter badge when audio talks about shutter speed (~2.8s)
  tl.fromTo($('shutter'), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: 'back.out(1.8)' }, 2.80);

  // Rolling Shutter Beam sweep
  tl.fromTo($('beam'), { opacity: 0, y: 10 }, { opacity: 1, y: 560, duration: 2.0, ease: 'sine.inOut', repeat: 5, yoyo: true }, 3.50);

  // Active Jelly Distortion on the image when audio mentions nanginginig o nagiging jelly (~9.5s)
  tl.fromTo($('jelly'), { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.5, ease: 'back.out(2)' }, 9.50);
  tl.fromTo($('photo'), { skewY: 0, scaleX: 1 }, { skewY: -4.5, scaleX: 1.03, duration: 0.35, ease: 'sine.inOut', repeat: 11, yoyo: true }, 10.00);

  // Clean Exit before cut (Seam Law: D - 0.45)
  tl.fromTo($('headline'), { opacity: 1 }, { opacity: 0, y: -15, duration: 0.35, ease: 'power2.in', immediateRender: false, force3D: true }, D - 0.45);
  tl.fromTo($('viewport'), { opacity: 1 }, { opacity: 0, scale: 0.95, duration: 0.35, ease: 'power2.in', immediateRender: false, force3D: true }, D - 0.45);

  window.__timelines = window.__timelines || {};
  window.__timelines['s08-jelly'] = tl;
})();
</script>
</template>

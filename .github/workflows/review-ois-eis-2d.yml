name: OIS EIS 2D review
on:
  push:
    branches: [recovery/ois-eis-cloud-transfer]
    paths: [.github/workflows/review-ois-eis-2d.yml]
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tooling
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-liberation fonts-dejavu-core
          python3 -m pip install pillow numpy
          npx --yes hyperframes@0.8.117 browser ensure
      - name: Configure Drive
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          RCLONE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone
          if [ -n "$GDRIVE_SA_KEY" ]; then
            printf '%s' "$GDRIVE_SA_KEY" > /tmp/gdrive_sa.json
            printf '[gdrive]\ntype = drive\nscope = drive\nservice_account_file = /tmp/gdrive_sa.json\n' > ~/.config/rclone/rclone.conf
          elif [ -n "$RCLONE_TOKEN" ]; then
            printf '[gdrive]\ntype = drive\nscope = drive\ntoken = %s\n' "$RCLONE_TOKEN" > ~/.config/rclone/rclone.conf
          else
            echo "::error::Drive credentials unavailable"
            exit 1
          fi
      - name: Restore original project and redesign
        run: |
          set -euo pipefail
          mkdir -p films/ois-eis-2d /tmp/review-output
          rclone copyto 'gdrive,root_folder_id=1lMz8NZJCUOz5qps79zzjrScs9zcJHbON:ois-eis-project.zip' /tmp/original.zip
          rclone copyto 'gdrive,root_folder_id=1e5vWo3I428uYbfE0O0vIY2aVhnMSyoED:ois-eis-2d-update.zip' /tmp/update.zip
          unzip -oq /tmp/original.zip -d films/ois-eis-2d
          unzip -oq /tmp/update.zip -d films/ois-eis-2d
      - name: Check and capture scenes
        working-directory: films/ois-eis-2d
        run: |
          set -o pipefail
          python3 ../../skills/spatial-film/scripts/fromto-scan.py compositions/s*.html 2>&1 | tee /tmp/review-output/fromto.txt
          npx --yes hyperframes@0.8.117 check 2>&1 | tee /tmp/review-output/check.txt
          npx --yes hyperframes@0.8.117 snapshot . --at 4,13,22,30,36,44,55,68,75,84 --no-end --describe false -o /tmp/review-output/snaps 2>&1 | tee /tmp/review-output/snapshot.txt
      - name: Upload review material
        if: always()
        run: rclone copy /tmp/review-output/ 'gdrive,root_folder_id=1e5vWo3I428uYbfE0O0vIY2aVhnMSyoED:review/' --progress
      - name: Upload review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ois-eis-2d-review
          path: /tmp/review-output/
